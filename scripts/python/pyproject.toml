[project]
name = "vibbix-scripts"
version = "0.1.0"
description = "My personal scripts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pexpect>=4.9.0",
    "rich>=14.3.3",
    "gitpython~=3.1.45",
    "PyGithub~=2.8.1",
    "tqdm~=4.67.3",
    "requests-cache~=1.3.1",
    "colorlog~=6.10.1",
    "colorama~=0.4.6",
    "sourcetypes3~=0.1.0",
    "blessed~=1.32.0",
    # Markdown parsing libraries
    # "mistletoe~=1.5.1",
    "beautifulsoup4~=4.14.3",
    "pasteboard~=0.4.0; sys_platform == 'darwin'",
    "mdutils~=1.8.1",
    # For scraping
    "PyChromeDevTools~=1.0.4",
    # for parsing bazel
    "libcst~=1.8.6",
    # for message box
    "pymsgbox~=2.0.1",
    "jinja2~=3.1.6"
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "jupyterlab>=4.5.2",
]
